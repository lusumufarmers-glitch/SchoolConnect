name: Build School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout School Connect
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check project
        run: |
          echo "Checking School Connect project..."
          test -f settings.gradle
          test -d app
          test -f app/build.gradle
          echo "Project structure OK."

      - name: Build Debug APK
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Check APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          echo "School Connect APK created successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
