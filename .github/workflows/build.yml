name: Build School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout School Connect
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Show project structure
        run: |
          echo "===== SCHOOL CONNECT PROJECT ====="
          find . -maxdepth 5 -type f | sort
          echo "=================================="

      - name: Build School Connect APK
        run: |
          gradle clean
          gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        run: |
          echo "===== APK OUTPUT ====="
          find app/build/outputs -type f -name "*.apk" -print
          echo "======================"
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload School Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
