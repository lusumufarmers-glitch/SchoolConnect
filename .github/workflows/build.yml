name: Build School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout School Connect
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for School Connect Gradle project..."

          PROJECT_FILE=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            echo "Repository files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"
          echo ""
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Build School Connect APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Gradle version:"
          gradle --version

          gradle clean
          gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created:"
          ls -lh "$APK"

      - name: Upload School Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
