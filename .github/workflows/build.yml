name: Build School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout School Connect
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract School Connect project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No School Connect ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Project files:"
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT_FILE=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -e

          APP_DIR="$PROJECT_DIR/app"

          if [ -f "$APP_DIR/build.gradle.kts" ]; then

            cat >> "$APP_DIR/build.gradle.kts" <<'EOF'

            // School Connect JVM compatibility fix
            android {
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
            }

            tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            EOF

            echo "Java and Kotlin targets set to JVM 17."

          elif [ -f "$APP_DIR/build.gradle" ]; then

            cat >> "$APP_DIR/build.gradle" <<'EOF'

            // School Connect JVM compatibility fix
            android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            EOF

            echo "Java and Kotlin targets set to JVM 17."

          else
            echo "ERROR: app/build.gradle or app/build.gradle.kts not found."
            exit 1
          fi

      - name: Build School Connect APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          gradle clean
          gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "================================"
          echo "SCHOOL CONNECT APK CREATED"
          echo "================================"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload School Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
