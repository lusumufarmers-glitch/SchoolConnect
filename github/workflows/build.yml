name: Build School Connect APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build School Connect APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find and extract School Connect
        shell: bash
        run: |
          set -e

          echo "Looking for School Connect project..."

          ZIP_FILE=$(find . -type f -name "*.zip" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            rm -rf extracted
            mkdir extracted

            unzip -q -o "$ZIP_FILE" -d extracted
          else
            echo "No ZIP found. Using repository files."
          fi

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -not -path "./.git/*" \
              -print -quit)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            echo ""
            echo "Project files:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare JVM compatibility fix
        shell: bash
        run: |
          set -e

          printf '%s\n' \
          'allprojects {' \
          '    tasks.withType(JavaCompile).configureEach {' \
          '        options.release.set(17)' \
          '    }' \
          '' \
          '    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {' \
          '        kotlinOptions.jvmTarget = "17"' \
          '    }' \
          '}' \
          > "$RUNNER_TEMP/school-connect-fix.gradle"

          echo "JVM compatibility fix created."

      - name: Build School Connect APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "Building from:"
          pwd

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          echo ""
          echo "Starting APK build..."

          gradle \
            --init-script "$RUNNER_TEMP/school-connect-fix.gradle" \
            clean \
            assembleDebug \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            echo ""
            find "$PROJECT_DIR" -type f | grep -E '\.apk$' || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload School Connect APK
        uses: actions/upload-artifact@v4
        with:
          name: School-Connect-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
